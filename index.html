<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="流声">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>流声</title>
  <style>
    :root { color-scheme:light; --bg:#f7f8fa; --ink:#202632; --line:#e7eaf0; --muted:#798598; --blue:#4169e1; --blue-pressed:#3257c5; --green:#19986d; --red:#c65353; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; overflow:hidden; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
    button,textarea { font:inherit; }
    .app { position:fixed; top:var(--viewport-top,0px); left:0; right:0; width:100%; max-width:680px; height:var(--viewport-height,100dvh); margin:auto; display:flex; flex-direction:column; gap:16px; padding:calc(env(safe-area-inset-top) + 23px) 20px calc(env(safe-area-inset-bottom) + 19px); }
    header { display:flex; flex-shrink:0; align-items:center; justify-content:space-between; gap:12px; margin-bottom:3px; }
    .name { font-size:19px; font-weight:750; letter-spacing:-.04em; }
    .connection { display:flex; gap:7px; align-items:center; color:#738093; font-size:12px; white-space:nowrap; }
    .dot { width:7px; height:7px; border-radius:50%; background:#c4ccd7; flex:none; }
    .connection.ok .dot { background:#24a16f; }
    .connection.bad .dot { background:#d35d5d; }
    .target { display:flex; flex-shrink:0; align-items:center; gap:8px; min-width:0; color:#69768a; font-size:12px; background:#eef1f6; border-radius:10px; padding:10px 12px; line-height:18px; }
    .target svg { width:15px; height:15px; color:#8490a4; flex:none; }
    .target-label { color:#8994a5; white-space:nowrap; }
    .target-name { font-weight:600; color:#566276; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
    .target.unavailable .target-name { font-weight:400; color:#9ba4b2; }
    .editor { position:relative; display:flex; flex:1; min-height:0; overflow:hidden; background:white; border:1px solid var(--line); border-radius:18px; transition:border-color .15s,box-shadow .15s; }
    .editor:focus-within { border-color:#acc0fb; box-shadow:0 0 0 3px #4169e10d; }
    textarea { flex:1; min-width:0; width:100%; min-height:0; padding:19px 19px 52px; resize:none; outline:none; border:0; background:transparent; color:var(--ink); font-size:17px; line-height:1.7; }
    textarea::placeholder { color:#b4bcc8; }
    .clear { position:absolute; right:13px; bottom:12px; padding:8px; border:0; background:transparent; color:#a4adba; border-radius:9px; cursor:pointer; }
    .clear svg { display:block; width:18px; height:18px; }
    .clear:focus-visible { outline:2px solid var(--blue); }
    .clear[hidden] { display:none; }
    .bottom { display:flex; flex-shrink:0; flex-direction:column; gap:8px; }
    .status { display:flex; align-items:center; gap:7px; min-height:18px; padding-left:2px; color:#8792a2; font-size:12px; line-height:18px; overflow-wrap:anywhere; }
    .status svg { width:14px; height:14px; flex:none; }
    .status.ready { color:#788596; }
    .status.pending { color:#657aa6; }
    .status.success { color:var(--green); }
    .status.error { color:var(--red); }
    .status.sending { color:var(--blue); }
    .status .spinner { width:12px; height:12px; border:2px solid #c4d2f7; border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .primary-action { min-width:0; min-height:48px; padding:10px 12px; display:flex; justify-content:center; align-items:center; gap:6px; border:0; border-radius:12px; background:var(--blue); color:white; font-size:16px; font-weight:650; cursor:pointer; transition:background .15s,transform .15s; }
    .primary-action:active { transform:scale(.99); background:var(--blue-pressed); }
    .primary-action:disabled { opacity:.46; cursor:default; transform:none; }
    .key-actions { display:grid; grid-template-columns:52px minmax(0,1fr) 52px; gap:8px; }
    .key-action { min-width:0; min-height:48px; padding:10px 8px; font-size:14px; white-space:nowrap; border:1px solid var(--line); border-radius:12px; background:white; color:#566276; cursor:pointer; }
    .key-action svg { display:block; width:22px; height:22px; margin:auto; }
    .key-action:active { background:#eef1f6; }
    .key-action:disabled { opacity:.46; cursor:default; }
    .primary-action:focus-visible, .key-action:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
    @media(min-width:600px) { .app { padding:38px 28px; } }
    .compact-viewport .app { gap:8px; padding-top:calc(env(safe-area-inset-top) + 10px); padding-bottom:calc(env(safe-area-inset-bottom) + 10px); }
    .compact-viewport header { margin-bottom:0; }
    .compact-viewport .target { padding-top:6px; padding-bottom:6px; }
    .compact-viewport .bottom { gap:8px; }
    .compact-viewport .primary-action, .compact-viewport .key-action { min-height:44px; padding-top:8px; padding-bottom:8px; }
    .compact-viewport textarea { padding-top:10px; }
    @media(prefers-reduced-motion:reduce) { * { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="name">流声</div>
      <div id="connection" class="connection" aria-live="polite"><span class="dot"></span><span id="connectionText">连接中</span></div>
    </header>
    <div id="target" class="target unavailable" aria-live="polite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
      <span class="target-label">当前目标</span>
      <span id="targetName" class="target-name">检测中…</span>
    </div>
    <div class="editor">
      <textarea id="draft" aria-label="输入文字" placeholder="输入文字…" maxlength="64000" spellcheck="false"></textarea>
      <button id="clear" class="clear" type="button" aria-label="清空文字" title="清空" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    </div>
    <div class="bottom">
      <div id="status" class="status ready" role="status" aria-live="polite"><span id="statusIcon" aria-hidden="true">○</span><span id="statusText">等待输入</span></div>
      <div class="key-actions" role="group" aria-label="发送与按键">
        <button id="send" class="key-action" type="button" aria-label="发送" title="发送文字" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7ZM11 13 22 2"/></svg>
        </button>
        <button id="enter" class="primary-action" type="button" disabled>回车 ↵</button>
        <button id="ctrlEnter" class="key-action" type="button" aria-label="Ctrl+回车" title="发送文字并按 Ctrl+回车" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8 3-4 3 4M20 5v8a3 3 0 0 1-3 3H5m5-5-5 5 5 5"/></svg>
        </button>
      </div>
    </div>
  </main>
  <script>
    (() => {
      // Keyboards can shrink only the visual viewport (not 100dvh), and Safari
      // can also pan it. Fit the whole flex layout to the visible rectangle.
      const viewport = window.visualViewport;
      let viewportFrame = 0;
      function updateViewport() {
        viewportFrame = 0;
        // Keep browser pinch zoom and panning independent of app layout.
        if (viewport && Math.abs(viewport.scale - 1) > 0.01) return;
        const height = viewport ? viewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--viewport-height', height + 'px');
        document.documentElement.style.setProperty('--viewport-top', (viewport ? viewport.offsetTop : 0) + 'px');
        document.documentElement.classList.toggle('compact-viewport', height < 500);
      }
      function scheduleViewportUpdate() {
        if (!viewportFrame) viewportFrame = requestAnimationFrame(updateViewport);
      }
      viewport?.addEventListener('resize', scheduleViewportUpdate);
      viewport?.addEventListener('scroll', scheduleViewportUpdate);
      window.addEventListener('resize', scheduleViewportUpdate);
      window.addEventListener('pageshow', scheduleViewportUpdate);
      updateViewport();

      const $ = (id) => document.getElementById(id);
      const draft = $('draft'), send = $('send');
      const connection = $('connection'), connectionText = $('connectionText');
      const target = $('target'), targetName = $('targetName');
      const status = $('status'), statusText = $('statusText'), statusIcon = $('statusIcon');
      const clear = $('clear');
      const enter = $('enter'), ctrlEnter = $('ctrlEnter');
      let keyReady = false;
      let ready = false, sending = false, delivery = null, connectionProblem = '连接中';
      const knownApps = [
        [/code(-oss)?|vscodium|visual studio code/i, 'VS Code'],
        [/firefox/i, 'Firefox'], [/chrom(e|ium)/i, 'Chrome / Chromium'],
        [/ghostty/i, 'Ghostty'], [/kitty/i, 'Kitty'], [/alacritty/i, 'Alacritty'],
        [/wezterm/i, 'WezTerm'], [/foot/i, 'Foot'], [/konsole/i, 'Konsole'],
        [/zed/i, 'Zed'], [/obsidian/i, 'Obsidian']
      ];
      try { draft.value = localStorage.getItem('li-draft') || ''; } catch (_) {}

      function setStatus(kind, text) {
        status.className = 'status ' + kind;
        statusIcon.className = kind === 'sending' ? 'spinner' : '';
        statusIcon.textContent = kind === 'sending' ? '' : ({ success:'✓', error:'!', pending:'•', ready:'○' }[kind] || '○');
        statusText.textContent = text;
      }

      function showIdleStatus() {
        if (sending) return;
        if (!ready) setStatus('error', connectionProblem);
        else if (delivery) setStatus(delivery.error ? 'error' : 'success', delivery.text);
        else if (draft.value.trim()) setStatus('pending', '待发送');
        else setStatus('ready', '等待输入');
      }

      function update() {
        enter.disabled = ctrlEnter.disabled = sending || !keyReady || (Boolean(draft.value.trim()) && !ready);
        send.disabled = sending || !ready || !draft.value.trim();
        clear.hidden = !draft.value.length;
        try { localStorage.setItem('li-draft', draft.value); } catch (_) {}
        showIdleStatus();
      }

      function updateTarget(item) {
        const appId = item && typeof item.app_id === 'string' ? item.app_id : '';
        const title = item && typeof item.title === 'string' ? item.title : '';
        if (!ready) {
          targetName.textContent = '不可用';
          target.classList.add('unavailable');
          target.removeAttribute('title');
        } else if (!appId && !title) {
          targetName.textContent = '未检测到窗口';
          target.classList.add('unavailable');
          target.removeAttribute('title');
        } else {
          const mapping = knownApps.find(([pattern]) => pattern.test(appId));
          const label = mapping ? mapping[1] : (appId.split('.').filter(Boolean).pop() || title);
          targetName.textContent = label;
          target.title = title && title !== label ? title : appId;
          target.classList.remove('unavailable');
        }
      }

      draft.addEventListener('input', () => { delivery = null; update(); });
      clear.addEventListener('click', () => { draft.value = ''; delivery = null; update(); draft.focus(); });

      async function timedFetch(url, options, milliseconds) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), milliseconds);
        try {
          const response = await fetch(url, { ...options, signal:controller.signal });
          const data = await response.json();
          return { response, data };
        } finally {
          clearTimeout(timer);
        }
      }

      async function check() {
        try {
          const { response:res, data } = await timedFetch('/api/status', { cache:'no-store' }, 3500);
          if (!res.ok) throw Error('offline');
          keyReady = Boolean(data.backend);
          ready = Boolean(data.clipboard && data.backend);
          connectionProblem = ready ? '' : 'Linux 缺少输入组件';
          connection.className = 'connection ' + (ready ? 'ok' : 'bad');
          connectionText.textContent = ready ? '已连接' : '缺少组件';
          updateTarget(data.target);
        } catch (_) {
          ready = false;
          keyReady = false;
          connectionProblem = 'Linux 连接已断开';
          connection.className = 'connection bad';
          connectionText.textContent = '未连接';
          updateTarget(null);
        }
        update();
      }

      send.addEventListener('click', async () => {
        if (sending || !ready || !draft.value.trim()) return;
        sending = true;
        delivery = null;
        send.setAttribute('aria-busy', 'true');
        setStatus('sending', '正在发送到 Linux…');
        update();
        const content = draft.value;
        try {
          const { response:res, data:result } = await timedFetch('/api/send', {
            method:'POST', headers:{ 'Content-Type':'application/json' },
            body:JSON.stringify({ text:content, paste_mode:'auto' })
          }, 20000);
          if (!res.ok || !result.ok) throw Error(result.message || '发送失败');
          if (draft.value === content) draft.value = '';
          delivery = { error:false, text:'已发送 · 已触发 Linux 粘贴' };
          if (result.target) updateTarget(result.target);
        } catch (err) {
          delivery = { error:true, text:'未确认发送结果 · 请先检查 Linux 输入框，再决定是否重试（' + (err.message || '连接异常') + '）' };
        } finally {
          sending = false;
          send.removeAttribute('aria-busy');
          update();
        }
      });

      async function sendKey(key, label) {
        if (sending || !keyReady || (draft.value.trim() && !ready)) return;
        const content = draft.value.trim() ? draft.value : '';
        sending = true;
        delivery = null;
        update();
        setStatus('sending', content ? '正在发送文字并触发 ' + label + '…' : '正在发送 ' + label + '…');
        try {
          const { response:res, data:result } = await timedFetch('/api/key', {
            method:'POST', headers:{ 'Content-Type':'application/json' },
            body:JSON.stringify({ key, text:content })
          }, 20000);
          if (!res.ok || !result.ok) throw Error(result.message || '按键发送失败');
          if (content && draft.value === content) draft.value = '';
          delivery = { error:false, text:content ? '已发送文字并触发 Linux ' + label : '已发送 · 已触发 Linux ' + label };
          if (result.target) updateTarget(result.target);
        } catch (err) {
          delivery = { error:true, text:'未确认发送结果 · 请先检查 Linux 输入框，再决定是否重试（' + (err.message || '连接异常') + '）' };
        } finally {
          sending = false;
          update();
        }
      }
      enter.addEventListener('click', () => sendKey('enter', '回车'));
      ctrlEnter.addEventListener('click', () => sendKey('ctrl_enter', 'Ctrl+回车'));

      if ('serviceWorker' in navigator && window.isSecureContext) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache:'none' })
            .catch((error) => console.warn('离线页面注册失败', error));
        });
      }

      update(); check(); setInterval(check, 4000);
    })();
  </script>
</body>
</html>
