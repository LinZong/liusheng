<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>流声</title>
  <style>
    :root { color-scheme:light; --bg:#f7f8fa; --ink:#202632; --line:#e7eaf0; --muted:#798598; --blue:#4169e1; --blue-pressed:#3257c5; --green:#19986d; --red:#c65353; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
    button,textarea { font:inherit; }
    .app { width:100%; max-width:680px; min-height:100dvh; margin:auto; display:flex; flex-direction:column; gap:16px; padding:calc(env(safe-area-inset-top) + 23px) 20px calc(env(safe-area-inset-bottom) + 19px); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:3px; }
    .name { font-size:19px; font-weight:750; letter-spacing:-.04em; }
    .connection { display:flex; gap:7px; align-items:center; color:#738093; font-size:12px; white-space:nowrap; }
    .dot { width:7px; height:7px; border-radius:50%; background:#c4ccd7; flex:none; }
    .connection.ok .dot { background:#24a16f; }
    .connection.bad .dot { background:#d35d5d; }
    .target { display:flex; align-items:center; gap:8px; min-width:0; color:#69768a; font-size:12px; background:#eef1f6; border-radius:10px; padding:10px 12px; line-height:18px; }
    .target svg { width:15px; height:15px; color:#8490a4; flex:none; }
    .target-label { color:#8994a5; white-space:nowrap; }
    .target-name { font-weight:600; color:#566276; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
    .target.unavailable .target-name { font-weight:400; color:#9ba4b2; }
    .editor { position:relative; display:flex; flex:1; min-height:220px; overflow:hidden; background:white; border:1px solid var(--line); border-radius:18px; transition:border-color .15s,box-shadow .15s; }
    .editor:focus-within { border-color:#acc0fb; box-shadow:0 0 0 3px #4169e10d; }
    textarea { flex:1; min-width:0; width:100%; min-height:0; padding:19px 19px 52px; resize:none; outline:none; border:0; background:transparent; color:var(--ink); font-size:17px; line-height:1.7; }
    textarea::placeholder { color:#b4bcc8; }
    .clear { position:absolute; right:13px; bottom:12px; padding:8px; border:0; background:transparent; color:#a4adba; border-radius:9px; cursor:pointer; }
    .clear svg { display:block; width:18px; height:18px; }
    .clear:focus-visible { outline:2px solid var(--blue); }
    .clear[hidden] { display:none; }
    .bottom { position:sticky; bottom:calc(env(safe-area-inset-bottom) + 10px); display:flex; flex-direction:column; gap:12px; }
    .status { display:flex; align-items:center; gap:7px; min-height:18px; padding-left:2px; color:#8792a2; font-size:12px; line-height:18px; overflow-wrap:anywhere; }
    .status svg { width:14px; height:14px; flex:none; }
    .status.ready { color:#788596; }
    .status.pending { color:#657aa6; }
    .status.success { color:var(--green); }
    .status.error { color:var(--red); }
    .status.sending { color:var(--blue); }
    .status .spinner { width:12px; height:12px; border:2px solid #c4d2f7; border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .send { width:100%; min-height:58px; padding:12px 20px; display:flex; justify-content:center; align-items:center; gap:10px; border:0; border-radius:15px; background:var(--blue); color:white; font-size:16px; font-weight:650; cursor:pointer; transition:background .15s,transform .15s; }
    .send:active { transform:scale(.99); background:var(--blue-pressed); }
    .send:disabled { opacity:.46; cursor:default; transform:none; }
    .send svg { width:19px; height:19px; }
    @media(min-width:600px) { .app { padding:38px 28px; } }
    @media(prefers-reduced-motion:reduce) { * { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="name">流声</div>
      <div id="connection" class="connection" aria-live="polite"><span class="dot"></span><span id="connectionText">连接中</span></div>
    </header>
    <div id="target" class="target unavailable" aria-live="polite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
      <span class="target-label">当前目标</span>
      <span id="targetName" class="target-name">检测中…</span>
    </div>
    <div class="editor">
      <textarea id="draft" aria-label="输入文字" placeholder="输入文字…" maxlength="64000" spellcheck="false"></textarea>
      <button id="clear" class="clear" type="button" aria-label="清空文字" title="清空" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    </div>
    <div class="bottom">
      <div id="status" class="status ready" role="status" aria-live="polite"><span id="statusIcon" aria-hidden="true">○</span><span id="statusText">等待输入</span></div>
      <button id="send" class="send" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7ZM11 13 22 2"/></svg>
        <span id="sendText">发送</span>
      </button>
    </div>
  </main>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const draft = $('draft'), send = $('send'), sendText = $('sendText');
      const connection = $('connection'), connectionText = $('connectionText');
      const target = $('target'), targetName = $('targetName');
      const status = $('status'), statusText = $('statusText'), statusIcon = $('statusIcon');
      const clear = $('clear');
      let ready = false, sending = false, delivery = null, connectionProblem = '连接中';
      const knownApps = [
        [/code(-oss)?|vscodium|visual studio code/i, 'VS Code'],
        [/firefox/i, 'Firefox'], [/chrom(e|ium)/i, 'Chrome / Chromium'],
        [/ghostty/i, 'Ghostty'], [/kitty/i, 'Kitty'], [/alacritty/i, 'Alacritty'],
        [/wezterm/i, 'WezTerm'], [/foot/i, 'Foot'], [/konsole/i, 'Konsole'],
        [/zed/i, 'Zed'], [/obsidian/i, 'Obsidian']
      ];
      try { draft.value = localStorage.getItem('li-draft') || ''; } catch (_) {}

      function setStatus(kind, text) {
        status.className = 'status ' + kind;
        statusIcon.className = kind === 'sending' ? 'spinner' : '';
        statusIcon.textContent = kind === 'sending' ? '' : ({ success:'✓', error:'!', pending:'•', ready:'○' }[kind] || '○');
        statusText.textContent = text;
      }

      function showIdleStatus() {
        if (sending) return;
        if (!ready) setStatus('error', connectionProblem);
        else if (delivery) setStatus(delivery.error ? 'error' : 'success', delivery.text);
        else if (draft.value.trim()) setStatus('pending', '待发送');
        else setStatus('ready', '等待输入');
      }

      function update() {
        send.disabled = sending || !ready || !draft.value.trim();
        clear.hidden = !draft.value.length;
        try { localStorage.setItem('li-draft', draft.value); } catch (_) {}
        showIdleStatus();
      }

      function updateTarget(item) {
        const appId = item && typeof item.app_id === 'string' ? item.app_id : '';
        const title = item && typeof item.title === 'string' ? item.title : '';
        if (!ready) {
          targetName.textContent = '不可用';
          target.classList.add('unavailable');
          target.removeAttribute('title');
        } else if (!appId && !title) {
          targetName.textContent = '未检测到窗口';
          target.classList.add('unavailable');
          target.removeAttribute('title');
        } else {
          const mapping = knownApps.find(([pattern]) => pattern.test(appId));
          const label = mapping ? mapping[1] : (appId.split('.').filter(Boolean).pop() || title);
          targetName.textContent = label;
          target.title = title && title !== label ? title : appId;
          target.classList.remove('unavailable');
        }
      }

      draft.addEventListener('input', () => { delivery = null; update(); });
      clear.addEventListener('click', () => { draft.value = ''; delivery = null; update(); draft.focus(); });

      async function check() {
        try {
          const res = await fetch('/api/status', { cache:'no-store', signal:AbortSignal.timeout(2300) });
          if (!res.ok) throw Error('offline');
          const data = await res.json();
          ready = Boolean(data.clipboard && data.backend);
          connectionProblem = ready ? '' : 'Linux 缺少输入组件';
          connection.className = 'connection ' + (ready ? 'ok' : 'bad');
          connectionText.textContent = ready ? '已连接' : '缺少组件';
          updateTarget(data.target);
        } catch (_) {
          ready = false;
          connectionProblem = 'Linux 连接已断开';
          connection.className = 'connection bad';
          connectionText.textContent = '未连接';
          updateTarget(null);
        }
        update();
      }

      send.addEventListener('click', async () => {
        if (sending || !ready || !draft.value.trim()) return;
        sending = true;
        delivery = null;
        sendText.textContent = '发送中…';
        setStatus('sending', '正在发送到 Linux…');
        update();
        const content = draft.value;
        try {
          const res = await fetch('/api/send', {
            method:'POST', headers:{ 'Content-Type':'application/json' },
            body:JSON.stringify({ text:content, paste_mode:'auto' }),
            signal:AbortSignal.timeout(8000)
          });
          const result = await res.json();
          if (!res.ok || !result.ok) throw Error(result.message || '发送失败');
          if (draft.value === content) draft.value = '';
          delivery = { error:false, text:'已发送 · 已触发 Linux 粘贴' };
          if (result.target) updateTarget(result.target);
        } catch (err) {
          delivery = { error:true, text:'发送失败 · ' + (err.message || '请重试') };
        } finally {
          sending = false;
          sendText.textContent = '发送';
          update();
        }
      });

      update(); check(); setInterval(check, 4000);
    })();
  </script>
</body>
</html>
